      var cls = L[2] === 2 ? ' class="sub"' : '';
      var neg = L[2] === 1;
      return '<tr' + cls + '><td class="name' + (neg ? ' ind' : '') + '">' + L[1] + '</td>' +
        chs.map(function (c) { return '<td class="n' + (neg ? ' neg' : '') + '">' +
          (neg ? '(' + usd(c[L[0]]).replace(/[()]/g, '') + ')' : usd(c[L[0]])) + '</td>'; }).join('') +
        '<td class="n' + (neg ? ' neg' : '') + '">' + (neg ? '(' + usd(a[L[0]]) + ')' : usd(a[L[0]])) + '</td>' +
        '<td class="n muted">' + pct(a[L[0]] / a.netRevenue) + '</td></tr>';
    }).join('');
    body += '<tr class="tot"><td class="name">Contribution %</td>' +
      chs.map(function (c) { return '<td class="n">' + pct(c.contributionMargin) + '</td>'; }).join('') +
      '<td class="n">' + pct(a.contributionMargin) + '</td><td class="n"></td></tr>';
    h += panel('Channel P&L to contribution', A.rangeLabel(),
      '<div class="scroll"><table><thead><tr><th>Line item</th>' +
      F.CHANNELS.map(function (c) { return '<th class="n">' + c.label + '</th>'; }).join('') +
      '<th class="n">Blended</th><th class="n">% net rev</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="note">Opex is a company-level primitive and is not allocated to channels, so contribution is the lowest line that can be stated per channel without an arbitrary driver.</div><div style="height:12px"></div>');

    h += '<div class="grid g2">';
    h += chartPanel('Contribution margin by channel', A.rangeLabel(), A.barsH({
      items: F.CHANNELS.map(function (c, i) {
        return { label: c.label, value: chs[i].contributionMargin, color: A.chColor(c.key) }; }),
      fmt: function (v) { return pct(v); }, w: 470, labelW: 96
    }), '', 'eBay carries the highest contribution rate on the smallest revenue base; Amazon is second by revenue and last by margin once referral fees, FBA and an ' +
      pct(chs[1].returnRate) + ' return rate are absorbed.');
    h += chartPanel('Net revenue mix', 'share of monthly net revenue', A.columns({
      labels: A.labels(), stacked: true, w: 470, h: 280,
      series: F.CHANNELS.map(function (c) {
        return { name: c.label, color: A.chColor(c.key),
          values: A.sliceCh(c.key).map(function (r) { return r.netRevenue; }) }; })
    }), chLeg());
    h += '</div>';

    var pts = [];
    F.CHANNELS.forEach(function (c) {
      A.sliceCh(c.key).forEach(function (r) {
        pts.push({ x: r.netRevenue, y: F.div(r.contribution, r.netRevenue), r: r.orders,
                   color: A.chColor(c.key) });
      });
    });
    h += chartPanel('Monthly net revenue against contribution rate', 'one point per channel-month, sized by orders',
      A.scatter({ points: pts, xlabel: 'Net revenue in the month', yfmt: function (v) { return pct(v, 0); } }),
      chLeg(), 'The channel bands barely overlap. Contribution rate here is a structural property of the channel, not a function of how much volume ran through it in the month.');
    return h;
  }

  /* --------------------------- Gross-to-net ----------------------------- */
  function gtn() {
    var a = A.agg(), h = '';
    h += chartPanel('Gross-to-net bridge \u2014 blended', A.rangeLabel(), wf(F.bridge(a), { share: a.grossSales }),
      leg([{ c: '#56697A', l: 'Gross sales' }, { c: '#AE1C2E', l: 'Deduction' },
           { c: '#27497F', l: 'Subtotal' }, { c: '#13212B', l: 'EBITDA' }]));

    h += '<div class="grid g2">';
    F.CHANNELS.forEach(function (c) {
      var g = A.aggCh(c.key);
      g.opex = 0; g.ebitda = g.contribution;
      var steps = F.bridge(g).slice(0, 10);
      h += chartPanel(c.label, A.rangeLabel() + ' \u00b7 to contribution',
        A.state.narrow ? A.waterfallH(steps) : A.waterfall(steps, { w: 520, h: 330, share: g.grossSales }));
    });
    h += '</div>';
    var blend = F.bridge(a);
    h += panel('Bridge steps as a share of gross sales', A.rangeLabel(),
      '<div class="scroll"><table><thead><tr><th>Step</th><th class="n">Blended</th><th class="n">%</th>' +
      F.CHANNELS.map(function (c) { return '<th class="n">' + c.label + ' %</th>'; }).join('') +
      '</tr></thead><tbody>' + blend.map(function (st, i) {
        var key = ['grossSales', 'returns', 'discounts', 'netRevenue', 'marketplaceFees', 'paymentFees',
                   'shipping', 'cogs', 'adSpend', 'contribution', 'opex', 'ebitda'][i];
        var chCells = F.CHANNELS.map(function (c) {
          var g = A.aggCh(c.key);
          if (key === 'opex' || key === 'ebitda') return '<td class="n muted">\u2014</td>';
          return '<td class="n">' + pct(g[key] / g.grossSales) + '</td>';
        }).join('');
        return '<tr' + (st.type !== 'delta' ? ' class="sub"' : '') + '><td class="name' +
          (st.type === 'delta' ? ' ind' : '') + '">' + st.label + '</td><td class="n">' + usd(st.value) +
          '</td><td class="n">' + pct(st.value / a.grossSales) + '</td>' + chCells + '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="note">Opex and EBITDA are shown blended only. Allocating a company-level cost across channels would invent a driver the data does not contain.</div><div style="height:12px"></div>');
    h += '</div>';
    return h;
  }

  /* -------------------------- Unit economics ---------------------------- */
  function unit() {
    var a = A.agg(), h = '', L = A.labels();
    h += '<section class="panel"><h2>Unit economics <em>' + esc(A.rangeLabel()) + '</em></h2><div class="kpis">' +
      kpi('Average order value', usd(a.aov, 2), num(a.orders) + ' orders', 'AOV = gross sales \u00f7 orders') +
      kpi('Average selling price', usd(a.asp, 2), num(a.units) + ' units', 'ASP = gross sales \u00f7 units') +
      kpi('Units per order', a.unitsPerOrder.toFixed(2), '', 'units \u00f7 orders') +
      kpi('Customer acquisition cost', usd(a.cac, 2), num(a.newCustomers) + ' new customers',
          'CAC = ad spend \u00f7 new customers. Paid media only; no salary or tooling loaded in.') +
      kpi('Contribution per order', usd(a.contributionPerOrder, 2),
          pct(F.div(a.contributionPerOrder, a.aov)) + ' of AOV', 'contribution \u00f7 orders') +
      kpi('Return rate', pct(a.returnRate), usd(a.returns) + ' returned', 'returns \u00f7 gross sales') +
      '</div></section>';

    var chs = F.CHANNELS.map(function (c) { return A.aggCh(c.key); });
    var metrics = [['aov', 'Average order value', 'usd2'], ['asp', 'Average selling price', 'usd2'],
      ['unitsPerOrder', 'Units per order', 'x2'], ['orders', 'Orders', 'num'], ['units', 'Units', 'num'],
      ['newCustomers', 'New customers', 'num'], ['cac', 'CAC', 'usd2'],
      ['contributionPerOrder', 'Contribution per order', 'usd2'], ['returnRate', 'Return rate', 'pct'],
      ['discountRate', 'Discount rate', 'pct'], ['contributionMargin', 'Contribution margin', 'pct']];
    function f(v, kind) {
      return kind === 'usd2' ? usd(v, 2) : kind === 'pct' ? pct(v) : kind === 'x2' ? v.toFixed(2) : num(v);
    }
    h += panel('By channel', A.rangeLabel(), '<div class="scroll"><table><thead><tr><th>Metric</th>' +
      F.CHANNELS.map(function (c) { return '<th class="n">' + c.label + '</th>'; }).join('') +
      '<th class="n">Blended</th></tr></thead><tbody>' + metrics.map(function (M) {
        return '<tr><td class="name">' + M[1] + '</td>' + chs.map(function (c) {
          return '<td class="n">' + f(c[M[0]], M[2]) + '</td>'; }).join('') +
          '<td class="n sub">' + f(a[M[0]], M[2]) + '</td></tr>';
      }).join('') + '</tbody></table></div>');

    function mini(title, pick, fmt, note) {
      return chartPanel(title, 'monthly', A.lines({
        labels: L, w: 470, h: 230, zero: false, fmt: fmt,
        series: F.CHANNELS.map(function (c) {
          return { color: A.chColor(c.key), values: A.sliceCh(c.key).map(pick) }; })
      }), chLeg(), note);
    }
    h += '<div class="grid g2">';
    h += mini('Average order value', function (r) { return F.div(r.grossSales, r.orders); },
      function (v) { return usd(v, 0); });
    h += mini('Customer acquisition cost', function (r) { return F.div(r.adSpend, r.newCustomers); },
      function (v) { return usd(v, 0); }, 'DTC acquisition is the expensive one. The marketplaces buy customers cheaply because the platform supplies the traffic and then charges for it further down the bridge.');
    h += mini('Contribution per order', function (r) { return F.div(r.contribution, r.orders); },
      function (v) { return usd(v, 0); });
    h += mini('Return rate', function (r) { return F.div(r.returns, r.grossSales); },
      function (v) { return pct(v, 0); }, 'January carries post-holiday returns against a thin sales month, which is why the rate spikes there across all three channels.');
    h += '</div>';
    return h;
  }

  /* ----------------------------- Inventory ------------------------------ */
  function inventory() {
    var a = A.agg(), s = A.slice(), L = A.labels(), h = '';
    h += '<section class="panel"><h2>Inventory <em>' + esc(A.rangeLabel()) + '</em></h2><div class="kpis">' +
      kpi('Days inventory outstanding', days(a.dio) + 'd', 'average balance ' + usdC(a.avgInventory),
          'DIO = average inventory \u00f7 COGS \u00d7 days in range. Average of the opening balance and every month-end close, not the closing balance.') +
      kpi('Weeks of cover', a.weeksOfCover.toFixed(1), '', 'average inventory \u00f7 (COGS \u00f7 days) \u00f7 7') +
      kpi('Opening inventory', usd(a.invOpen), F.MONTHS[A.state.m0] + ' 1', 'stored primitive for January; rolled forward thereafter') +
      kpi('Purchases', usd(a.purchases), 'company level', 'stored primitive') +
      kpi('COGS', usd(a.cogs), 'sum of channel COGS', 'inventory is pooled at company level; COGS is stored per channel') +
      kpi('Closing inventory', usd(a.invClose), F.MONTHS[A.state.m1] + ' close',
          'closing = opening + purchases \u2212 COGS. Never stored.') +
      '</div></section>';

    h += chartPanel('Purchases against COGS, inventory overlaid', 'monthly', A.columns({
      labels: L, h: 320, rightAxis: true,
      series: [{ color: '#27497F', values: s.map(function (r) { return r.purchases; }) },
               { color: '#8496A4', values: s.map(function (r) { return r.cogs; }) }],
      line: { values: s.map(function (r) { return r.invClose; }), color: '#9C6A16' }
    }), leg([{ c: '#27497F', l: 'Purchases' }, { c: '#8496A4', l: 'COGS' },
             { c: '#9C6A16', l: 'Closing inventory (right axis)' }]),
      'Purchases run ahead of COGS from May, peak in September and collapse in December. The build is the reason healthy EBITDA does not turn into cash.');

    var body = s.map(function (r) {
      return '<tr><td class="name">' + r.name + '</td><td class="n">' + usd(r.invOpen) + '</td>' +
        '<td class="n">' + usd(r.purchases) + '</td><td class="n neg">(' + usd(r.cogs) + ')</td>' +
        '<td class="n">' + usd(r.invClose) + '</td><td class="n ' + A.sign(r.dInventory) + '">' +
        usd(r.dInventory) + '</td><td class="n muted">' +
        days(F.div(r.invClose, r.cogs) * r.days) + '</td></tr>';
    }).join('');
    h += panel('Roll-forward', A.rangeLabel(), '<div class="scroll"><table><thead><tr><th>Month</th>' +
      '<th class="n">Opening</th><th class="n">Purchases</th><th class="n">COGS</th><th class="n">Closing</th>' +
      '<th class="n">Movement</th><th class="n">Closing DIO</th></tr></thead><tbody>' + body +
      '<tr class="tot"><td class="name">' + esc(A.rangeLabel()) + '</td><td class="n">' + usd(a.invOpen) +
      '</td><td class="n">' + usd(a.purchases) + '</td><td class="n neg">(' + usd(a.cogs) + ')</td><td class="n">' +
      usd(a.invClose) + '</td><td class="n ' + A.sign(a.invClose - a.invOpen) + '">' + usd(a.invClose - a.invOpen) +
      '</td><td class="n">' + days(a.dio) + '</td></tr></tbody></table></div>' +
      '<div class="note">The closing column is computed, not stored, which is why the identity at the foot of the screen cannot drift. The final column uses the closing balance for that single month; the KPI above uses average balances across the range.</div><div style="height:12px"></div>');
    return h;
  }

  /* -------------------------- Working capital --------------------------- */
  function workingCapital() {
    var a = A.agg(), s = A.slice(), L = A.labels(), h = '';
    h += '<section class="panel"><h2>Working capital <em>' + esc(A.rangeLabel()) + '</em></h2><div class="kpis">' +
      kpi('DIO', days(a.dio) + 'd', 'avg inv ' + usdC(a.avgInventory), 'average inventory \u00f7 COGS \u00d7 days') +
      kpi('DSO', days(a.dso) + 'd', 'avg AR ' + usdC(a.avgAR),
          'average AR \u00f7 non-marketplace net revenue \u00d7 days. AR is DTC only; marketplace money in flight sits in the unsettled balance instead, so nothing is counted twice.') +
      kpi('Settlement lag', days(a.settlementLag) + 'd', 'avg unsettled ' + usdC(a.avgUnsettled),
          'average unsettled marketplace balance \u00f7 marketplace remittance \u00d7 days') +
      kpi('DPO', days(a.dpo) + 'd', 'avg AP ' + usdC(a.avgAP),
          'average AP \u00f7 purchases \u00d7 days. AP is trade payables against inventory purchases, not opex accruals.') +
      kpi('Cash conversion cycle', days(a.ccc) + 'd', '', 'CCC = DIO + DSO + settlement lag \u2212 DPO') +
      '</div></section>';

    h += '<div class="grid g2">';
    h += chartPanel('Cash conversion cycle', A.rangeLabel(), A.barsH({
      items: [{ label: 'DIO', value: a.dio, color: '#9C6A16' },
              { label: 'DSO', value: a.dso, color: '#27497F' },
              { label: 'Settlement lag', value: a.settlementLag, color: '#5B7FA8' },
              { label: 'DPO', value: -a.dpo, color: '#1C6A4C' },
              { label: 'CCC', value: a.ccc, color: '#13212B' }],
      fmt: function (v) { return days(v) + 'd'; }, w: 470, labelW: 106
    }), '', 'DSO is measured on DTC net revenue and the settlement lag on marketplace remittance, because each ties to the asset it funds. The four therefore describe different denominators and the cycle is a duration, not an arithmetic sum of one revenue base.');
    h += chartPanel('Balances', 'month-end', A.lines({
      labels: L, w: 470, h: 280,
      series: [{ color: '#9C6A16', values: s.map(function (r) { return r.invClose; }) },
               { color: '#27497F', values: s.map(function (r) { return r.ar; }) },
               { color: '#5B7FA8', values: s.map(function (r) { return r.unsettled; }) },
               { color: '#1C6A4C', values: s.map(function (r) { return r.ap; }) }]
    }), leg([{ c: '#9C6A16', l: 'Inventory' }, { c: '#27497F', l: 'AR' },
             { c: '#5B7FA8', l: 'Unsettled marketplace' }, { c: '#1C6A4C', l: 'AP' }]));
    h += '</div>';

    var body = s.map(function (r) {
      return '<tr><td class="name">' + r.name + '</td><td class="n">' + usd(r.invClose) + '</td><td class="n">' +
        usd(r.ar) + '</td><td class="n">' + usd(r.unsettled) + '</td><td class="n">' + usd(r.ap) + '</td>' +
        '<td class="n">' + usd(r.invClose + r.ar + r.unsettled - r.ap) + '</td>' +
        '<td class="n muted">' + usd(r.marketplaceRemittance) + '</td></tr>';
    }).join('');
    h += panel('Balances and marketplace remittance', A.rangeLabel(),
      '<div class="scroll"><table><thead><tr><th>Month</th><th class="n">Inventory</th><th class="n">AR</th>' +
      '<th class="n">Unsettled</th><th class="n">AP</th><th class="n">Net working capital</th>' +
      '<th class="n">Remittance received</th></tr></thead><tbody>' + body +
      '<tr class="tot"><td class="name">Average</td><td class="n">' + usd(a.avgInventory) + '</td><td class="n">' +
      usd(a.avgAR) + '</td><td class="n">' + usd(a.avgUnsettled) + '</td><td class="n">' + usd(a.avgAP) +
      '</td><td class="n">' + usd(a.avgInventory + a.avgAR + a.avgUnsettled - a.avgAP) + '</td>' +
      '<td class="n">' + usd(a.marketplaceRemittance) + '</td></tr></tbody></table></div>' +
      '<div class="note">Remittance received = marketplace net revenue \u2212 the movement in the unsettled balance. It is the cash the platforms actually paid over in the period.</div><div style="height:12px"></div>');
    return h;
  }

  /* ------------------------------- Cash --------------------------------- */
  function cash() {
    var a = A.agg(), s = A.slice(), L = A.labels(), h = '';
    var dWC = a.dInventory + a.dAR + a.dUnsettled - a.dAP;
    h += '<section class="panel"><h2>Cash flow <em>' + esc(A.rangeLabel()) + ' \u00b7 indirect</em></h2><div class="kpis">' +
      kpi('EBITDA', usd(a.ebitda), pct(a.ebitdaMargin) + ' of net revenue', 'contribution \u2212 opex') +
      kpi('Working capital movement', usd(-dWC), 'inventory ' + usdC(-a.dInventory),
          '\u2212\u0394inventory \u2212 \u0394AR \u2212 \u0394unsettled + \u0394AP', dWC > 0 ? 'neg' : '') +
      kpi('Capex', usd(a.capex), '', 'stored primitive') +
      kpi('Free cash flow', usd(a.fcf), pct(a.fcfConversion) + ' of EBITDA',
          'EBITDA \u2212 \u0394inventory \u2212 \u0394AR \u2212 \u0394unsettled + \u0394AP \u2212 capex. Before tax, interest and financing.',
          a.fcf < 0 ? 'neg' : '') +
      kpi('Opening cash', usd(a.cashOpen), F.MONTHS[A.state.m0] + ' 1', 'stored primitive for January; rolled forward thereafter') +
      kpi('Closing cash', usd(a.cashClose), '', 'opening cash + free cash flow') +
      '</div></section>';

    var steps = [
      { label: 'EBITDA', value: a.ebitda, type: 'start' },
      { label: '\u0394 Inventory', value: -a.dInventory, type: 'delta' },
      { label: '\u0394 Receivables', value: -a.dAR, type: 'delta' },
      { label: '\u0394 Unsettled', value: -a.dUnsettled, type: 'delta' },
      { label: '\u0394 Payables', value: a.dAP, type: 'delta' },
      { label: 'Capex', value: -a.capex, type: 'delta' },
      { label: 'Free cash flow', value: a.fcf, type: 'end' }
    ];
    h += chartPanel('EBITDA to free cash flow', A.rangeLabel(), wf(steps),
      leg([{ c: '#1C6A4C', l: 'Cash released' }, { c: '#AE1C2E', l: 'Cash absorbed' }, { c: '#13212B', l: 'Free cash flow' }]),
      'Inventory absorbs almost the whole of EBITDA. The business is profitable and cash-flat at the same time, which is the normal shape for a seasonal goods brand buying ahead of Q4 \u2014 and the reason a P&L-only dashboard would mislead here.');

    h += chartPanel('Cash balance', 'month-end', A.columns({
      labels: L, h: 300, rightAxis: true,
      series: [{ color: '#8496A4', values: s.map(function (r) { return r.fcf; }) }],
      line: { values: s.map(function (r) { return r.cashClose; }), color: '#13212B' }
    }), leg([{ c: '#8496A4', l: 'Free cash flow in month' }, { c: '#13212B', l: 'Closing cash (right axis)' }]));

    var body = s.map(function (r) {
      return '<tr><td class="name">' + r.name + '</td><td class="n">' + usd(r.ebitda) + '</td>' +
        '<td class="n ' + A.sign(-r.dInventory) + '">' + usd(-r.dInventory) + '</td>' +
        '<td class="n ' + A.sign(-r.dAR) + '">' + usd(-r.dAR) + '</td>' +
        '<td class="n ' + A.sign(-r.dUnsettled) + '">' + usd(-r.dUnsettled) + '</td>' +
        '<td class="n ' + A.sign(r.dAP) + '">' + usd(r.dAP) + '</td>' +
        '<td class="n neg">(' + usd(r.capex) + ')</td>' +
        '<td class="n ' + A.sign(r.fcf) + '">' + usd(r.fcf) + '</td>' +
        '<td class="n">' + usd(r.cashClose) + '</td></tr>';
    }).join('');
    h += panel('Indirect walk', A.rangeLabel(), '<div class="scroll"><table><thead><tr><th>Month</th>' +
      ['EBITDA', '\u2212\u0394Inventory', '\u2212\u0394AR', '\u2212\u0394Unsettled', '+\u0394AP', 'Capex', 'Free cash flow', 'Closing cash']
        .map(function (x) { return '<th class="n">' + x + '</th>'; }).join('') + '</tr></thead><tbody>' + body +
      '<tr class="tot"><td class="name">' + esc(A.rangeLabel()) + '</td><td class="n">' + usd(a.ebitda) +
      '</td><td class="n">' + usd(-a.dInventory) + '</td><td class="n">' + usd(-a.dAR) + '</td><td class="n">' +
      usd(-a.dUnsettled) + '</td><td class="n">' + usd(a.dAP) + '</td><td class="n neg">(' + usd(a.capex) +
      ')</td><td class="n">' + usd(a.fcf) + '</td><td class="n">' + usd(a.cashClose) + '</td></tr></tbody></table></div>');
    return h;
  }

  /* ------------------------------ Variance ------------------------------ */
  function variance() {
    var cmpKey = A.state.compare;
    var a = A.agg('actual'), p = A.agg(cmpKey);
    var v = F.varianceTable(a, p), h = '';
    var cmpLabel = cmpKey === 'plan' ? 'Plan' : 'Forecast';

    h += '<section class="panel"><h2>Actual against ' + esc(cmpLabel) + ' <em>' + esc(A.rangeLabel()) +
      '</em></h2><div class="kpis">' +
      kpi('Gross sales variance', usd(a.grossSales - p.grossSales), pct(F.div(a.grossSales, p.grossSales) - 1),
          'actual \u2212 ' + cmpLabel.toLowerCase(), A.fav(a.grossSales - p.grossSales)) +
      kpi('Contribution variance', usd(v.contribution.total), pct(F.div(v.contribution.total, p.contribution)),
          'signed sum of the line variances above contribution', A.fav(v.contribution.total)) +
      kpi('EBITDA variance', usd(v.ebitda.total), A.pp(a.ebitdaMargin - p.ebitdaMargin) + ' of margin',
          'contribution variance + opex spend variance', A.fav(v.ebitda.total)) +
      kpi('Volume effect', usd(v.ebitda.volume), num(a.units - p.units) + ' units',
          '(actual units \u2212 plan units) \u00d7 plan price \u00d7 plan rate', A.fav(v.ebitda.volume)) +
      kpi('Price effect', usd(v.ebitda.price), usd(a.asp - p.asp, 2) + ' on ASP',
          'actual units \u00d7 (actual price \u2212 plan price) \u00d7 plan rate', A.fav(v.ebitda.price)) +
      kpi('Rate effect', usd(v.ebitda.rate), 'cost and deduction rates',
          'actual units \u00d7 actual price \u00d7 (actual rate \u2212 plan rate)', A.fav(v.ebitda.rate)) +
      '</div></section>';

    var steps = [
      { label: cmpLabel + ' EBITDA', value: p.ebitda, type: 'start' },
      { label: 'Volume', value: v.ebitda.volume, type: 'delta' },
      { label: 'Price', value: v.ebitda.price, type: 'delta' },
      { label: 'Rate', value: v.ebitda.rate, type: 'delta' },
      { label: 'Opex spend', value: v.ebitda.spend, type: 'delta' },
      { label: 'Actual EBITDA', value: a.ebitda, type: 'end' }
    ];
    h += chartPanel('EBITDA bridge', A.rangeLabel(), wf(steps),
      leg([{ c: '#1C6A4C', l: 'Favourable' }, { c: '#AE1C2E', l: 'Unfavourable' }]),
      'Volume is favourable and price is unfavourable, and they very nearly cancel. The miss is almost entirely rate: returns, discounting, fulfilment and paid media all ran worse per dollar of gross sales than planned. Reading this as a demand problem would send the business after the wrong fix.');

    function row(r, cls) {
      return '<tr class="' + (cls || '') + '"><td class="name">' + esc(r.label) + '</td>' +
        '<td class="n">' + usd(r.actual) + '</td><td class="n">' + usd(r.plan) + '</td>' +
        '<td class="n ' + A.fav(r.volume) + '">' + usd(r.volume) + '</td>' +
        '<td class="n ' + A.fav(r.price) + '">' + usd(r.price) + '</td>' +
        '<td class="n ' + A.fav(r.rate) + '">' + usd(r.rate) + '</td>' +
        '<td class="n ' + A.fav(r.spend || 0) + '">' + (r.spend === undefined ? '\u2014' : usd(r.spend)) + '</td>' +
        '<td class="n ' + A.fav(r.total) + '">' + usd(r.total) + '</td>' +
        '<td class="n muted">' + r.residual.toFixed(2) + '</td></tr>';
    }
    var body = v.rows.map(function (r) { return row(r); }).join('') +
      row(v.contribution, 'sub') + row(v.opex) + row(v.ebitda, 'tot');
    h += panel('Driver decomposition', 'favourable to EBITDA shown positive',
      '<div class="scroll"><table><thead><tr><th>Line item</th><th class="n">Actual</th><th class="n">' +
      esc(cmpLabel) + '</th><th class="n">Volume</th><th class="n">Price</th><th class="n">Rate</th>' +
      '<th class="n">Spend</th><th class="n">Total</th><th class="n">Residual</th></tr></thead><tbody>' + body +
      '</tbody></table></div><div class="note">The split is sequential and order-fixed: volume at ' + esc(cmpLabel.toLowerCase()) +
      ' price and ' + esc(cmpLabel.toLowerCase()) + ' rate, then price at actual volume and ' + esc(cmpLabel.toLowerCase()) +
      ' rate, then rate at actual volume and actual price. The three therefore sum to the total exactly; the residual column is the proof and reads zero on every row and every month range.</div><div style="height:12px"></div>');

    var chBody = F.CHANNELS.map(function (c) {
      var ca = A.aggCh(c.key, 'actual'), cp = A.aggCh(c.key, cmpKey);
      var cv = F.varianceTable(ca, cp);
      return '<tr><td class="name">' + c.label + '</td>' +
        '<td class="n">' + usd(ca.netRevenue - cp.netRevenue) + '</td>' +
        '<td class="n ' + A.fav(cv.contribution.volume) + '">' + usd(cv.contribution.volume) + '</td>' +
        '<td class="n ' + A.fav(cv.contribution.price) + '">' + usd(cv.contribution.price) + '</td>' +
        '<td class="n ' + A.fav(cv.contribution.rate) + '">' + usd(cv.contribution.rate) + '</td>' +
        '<td class="n ' + A.fav(cv.contribution.total) + '">' + usd(cv.contribution.total) + '</td>' +
        '<td class="n">' + A.pp(ca.contributionMargin - cp.contributionMargin) + '</td></tr>';
    }).join('');
    h += panel('Contribution variance by channel', A.rangeLabel(),
      '<div class="scroll"><table><thead><tr><th>Channel</th><th class="n">Net revenue var</th>' +
      '<th class="n">Volume</th><th class="n">Price</th><th class="n">Rate</th><th class="n">Contribution var</th>' +
      '<th class="n">Margin</th></tr></thead><tbody>' + chBody + '</tbody></table></div>');
    return h;
  }

  window.TABS = {
    overview: overview, channel: channelTab, gtn: gtn, unit: unit,
    inventory: inventory, wc: workingCapital, cash: cash, variance: variance
  };
  window.TABHELP = { kpi: kpi, panel: panel, chartPanel: chartPanel, leg: leg };
}());

</script>
<script>
/* ============ app shell: inputs, Excel, persistence, identities ============ */
(function () {
  'use strict';
  var A = APP, F = FPA, S = A.state;
  var usd = A.usd, pct = A.pct, esc = A.esc, num = A.num;
  var KEY = 'fpa-dashboard-v1';
  var PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;

  var TABLIST = [
    ['overview', 'Overview'], ['channel', 'Channel'], ['gtn', 'Gross-to-Net'],
    ['unit', 'Unit Economics'], ['inventory', 'Inventory'], ['wc', 'Working Capital'],
    ['cash', 'Cash Flow'], ['variance', 'Variance'], ['inputs', 'Inputs']
  ];

  /* ------------------------------ data plumbing ------------------------- */
  function recompute() {
    S.derived = {};
    F.SCENARIOS.forEach(function (s) { S.derived[s.key] = F.derive(S.data, s.key); });
  }

  function validate(d) {
    try {
      if (!d || !d.opening || !d.scenarios) return 'missing opening balances or scenarios';
      var ks = ['actual', 'plan', 'forecast'], i, j, k;
      for (i = 0; i < ks.length; i++) {
        var sc = d.scenarios[ks[i]];
        if (!sc || !sc.channel || !sc.company) return 'scenario "' + ks[i] + '" is incomplete';
        for (j = 0; j < F.CHANNELS.length; j++) {
          var ch = sc.channel[F.CHANNELS[j].key];
          if (!ch) return 'scenario "' + ks[i] + '" has no ' + F.CHANNELS[j].key + ' channel';
          for (k = 0; k < F.CHANNEL_LINES.length; k++) {
            var arr = ch[F.CHANNEL_LINES[k].key];
            if (!arr || arr.length !== 12) return F.CHANNELS[j].key + ' / ' + F.CHANNEL_LINES[k].key + ' is not 12 months';
          }
        }
        for (k = 0; k < F.COMPANY_LINES.length; k++)
          if (!sc.company[F.COMPANY_LINES[k].key] || sc.company[F.COMPANY_LINES[k].key].length !== 12)
            return 'company / ' + F.COMPANY_LINES[k].key + ' is not 12 months';
      }
      return null;
    } catch (e) { return e.message; }
  }

  function storageOK() {
    try { localStorage.setItem(KEY + '-probe', '1'); localStorage.removeItem(KEY + '-probe'); return true; }
    catch (e) { S.storageNote = e.name === 'SecurityError' ? 'blocked by the browser' : (e.name || 'unavailable'); return false; }
  }
  function save() {
    if (!S.storage) return false;
    try { localStorage.setItem(KEY, JSON.stringify(S.data)); return true; }
    catch (e) { S.storage = false; S.storageNote = 'write failed (' + (e.name || 'error') + ')'; return false; }
  }

  /* -------------------------------- Excel -------------------------------- */
  // Excel serial dates, converted arithmetically in UTC. SheetJS cellDates
  // returns a Date one millisecond before local midnight, which silently
  // shifts every date back a day anywhere east of Greenwich, so we never
  // let it build Date objects for us.
  var EPOCH = Date.UTC(1899, 11, 30);
  function toSerial(y, mIdx) { return (Date.UTC(y, mIdx, 1) - EPOCH) / 86400000; }
  function monthFromSerial(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 61 || v > 80000) return -1;
    var d = new Date(EPOCH + Math.round(v) * 86400000);
    return d.getUTCFullYear() < 1900 ? -1 : d.getUTCMonth();
  }

  function buildSheet(scenarioKey) {
    var sc = S.data.scenarios[scenarioKey], aoa = [], i, j, m;
    var head = ['Channel', 'Line Item'];
    for (m = 0; m < 12; m++) head.push(toSerial(S.data.meta.year || F.YEAR, m));
    aoa.push(head);
    for (i = 0; i < F.CHANNELS.length; i++) for (j = 0; j < F.CHANNEL_LINES.length; j++) {
      var r = [F.CHANNELS[i].label, F.CHANNEL_LINES[j].label];
      for (m = 0; m < 12; m++) r.push(sc.channel[F.CHANNELS[i].key][F.CHANNEL_LINES[j].key][m]);
      aoa.push(r);
    }
    for (j = 0; j < F.COMPANY_LINES.length; j++) {
      var rc = ['Company', F.COMPANY_LINES[j].label];
      for (m = 0; m < 12; m++) rc.push(sc.company[F.COMPANY_LINES[j].key][m]);
      aoa.push(rc);
    }
    for (j = 0; j < F.OPENING_LINES.length; j++) {
      var ro = ['Company', F.OPENING_LINES[j].label, S.data.opening[F.OPENING_LINES[j].key]];
      for (m = 1; m < 12; m++) ro.push(null);
      aoa.push(ro);
    }
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    for (m = 0; m < 12; m++) {
      var ref = XLSX.utils.encode_cell({ r: 0, c: 2 + m });
      ws[ref] = { t: 'n', v: toSerial(S.data.meta.year || F.YEAR, m), z: 'mmm-yy' };
    }
    ws['!cols'] = [{ wch: 14 }, { wch: 28 }].concat(Array.apply(null, Array(12)).map(function () { return { wch: 13 }; }));
    return ws;
  }

  function downloadTemplate(scenarioKey) {
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, buildSheet(scenarioKey), 'Data');
    XLSX.writeFile(wb, 'fpa-template-' + scenarioKey + '.xlsx');
  }

  function norm(s) { return String(s === null || s === undefined ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }
  var CH_ALIAS = {}, LINE_ALIAS = {}, CO_ALIAS = {}, OPEN_ALIAS = {};
  F.CHANNELS.forEach(function (c) { CH_ALIAS[norm(c.label)] = c.key; CH_ALIAS[norm(c.key)] = c.key; });
  CH_ALIAS['shopify'] = 'shopify'; CH_ALIAS['dtc'] = 'shopify'; CH_ALIAS['shopify dtc'] = 'shopify';
  F.CHANNEL_LINES.forEach(function (l) { LINE_ALIAS[norm(l.label)] = l.key; LINE_ALIAS[norm(l.key)] = l.key; });
  LINE_ALIAS['shipping and fulfilment'] = 'shipping'; LINE_ALIAS['shipping & fulfillment'] = 'shipping';
  LINE_ALIAS['shipping and fulfillment'] = 'shipping'; LINE_ALIAS['cost of goods sold'] = 'cogs';
  LINE_ALIAS['unsettled'] = 'unsettled'; LINE_ALIAS['unsettled balance'] = 'unsettled';
  F.COMPANY_LINES.forEach(function (l) { CO_ALIAS[norm(l.label)] = l.key; CO_ALIAS[norm(l.key)] = l.key; });
  CO_ALIAS['ar'] = 'accountsReceivable'; CO_ALIAS['ap'] = 'accountsPayable';
  CO_ALIAS['operating expenses'] = 'opex'; CO_ALIAS['inventory purchases'] = 'purchases';
  F.OPENING_LINES.forEach(function (l) { OPEN_ALIAS[norm(l.label)] = l.key; });

  function parseWorkbook(buf) {
    var errs = [], wb, ws, aoa;
    try {
      wb = XLSX.read(new Uint8Array(buf), { type: 'array' });     // never cellDates
      ws = wb.Sheets[wb.SheetNames[0]];
      aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
    } catch (e) { return { errors: [{ row: '\u2014', what: 'File', why: 'could not be read as a workbook (' + (e.message || e) + ')' }] }; }
    if (!aoa || aoa.length < 2) return { errors: [{ row: '\u2014', what: 'Sheet', why: 'is empty' }] };

    var head = aoa[0], colMonth = {}, seen = {}, c;
    for (c = 2; c < head.length && c < 14; c++) {
      var mi = monthFromSerial(head[c]);
      if (mi < 0) {
        errs.push({ row: 1, what: 'Header ' + XLSX.utils.encode_col(c) + '1',
          why: 'is not a readable Excel date' + (typeof head[c] === 'string' ? ' (text "' + head[c] + '" \u2014 the template writes real dates, not text)' : '') });
        continue;
      }
      if (seen[mi]) { errs.push({ row: 1, what: 'Header ' + XLSX.utils.encode_col(c) + '1', why: 'repeats ' + F.MONTHS[mi] }); continue; }
      seen[mi] = true; colMonth[c] = mi;
    }
    var have = Object.keys(colMonth).length;
    if (have === 0) return { errors: errs.concat([{ row: 1, what: 'Header row', why: 'has no readable month dates in columns C to N' }]) };
    for (var mm = 0; mm < 12; mm++) if (!seen[mm]) errs.push({ row: 1, what: F.MONTHS[mm], why: 'has no column; those months import as zero' });

    var sc = { channel: {}, company: {} }, opening = {}, dupe = {}, i, j;
    F.CHANNELS.forEach(function (ch) {
      sc.channel[ch.key] = {};
      F.CHANNEL_LINES.forEach(function (l) { sc.channel[ch.key][l.key] = new Array(12).fill(0); });
    });
    F.COMPANY_LINES.forEach(function (l) { sc.company[l.key] = new Array(12).fill(0); });
    var filled = {};

    for (i = 1; i < aoa.length; i++) {
      var row = aoa[i], rn = i + 1;
      if (!row || (row[0] === null && row[1] === null)) continue;
      var who = norm(row[0]), what = norm(row[1]);
      if (!who && !what) continue;
      if (!what) { errs.push({ row: rn, what: String(row[0] || ''), why: 'has no line item in column B' }); continue; }

      var isCompany = (who === 'company' || who === 'co' || who === '');
      var chKey = CH_ALIAS[who];
      if (!isCompany && !chKey) { errs.push({ row: rn, what: String(row[0]), why: 'is not a recognised channel' }); continue; }

      var target = null, lineKey = null, kind = '';
      if (chKey) {
        lineKey = LINE_ALIAS[what];
        if (!lineKey) { errs.push({ row: rn, what: String(row[1]), why: 'is not a recognised channel line item' }); continue; }
        target = sc.channel[chKey][lineKey]; kind = chKey + '/' + lineKey;
      } else if (OPEN_ALIAS[what]) {
        var ok = OPEN_ALIAS[what], ov = row[2];
        if (typeof ov !== 'number' || !isFinite(ov)) { errs.push({ row: rn, what: String(row[1]), why: 'has no numeric opening value in column C' }); continue; }
        if (dupe['open/' + ok]) { errs.push({ row: rn, what: String(row[1]), why: 'is a duplicate row' }); continue; }
        dupe['open/' + ok] = true; opening[ok] = ov; filled['open/' + ok] = true; continue;
      } else {
        lineKey = CO_ALIAS[what];
        if (!lineKey) { errs.push({ row: rn, what: String(row[1]), why: 'is not a recognised company line item' }); continue; }
        target = sc.company[lineKey]; kind = 'company/' + lineKey;
      }

      if (dupe[kind]) { errs.push({ row: rn, what: (row[0] || 'Company') + ' \u00b7 ' + row[1], why: 'is a duplicate row' }); continue; }
      dupe[kind] = true; filled[kind] = true;

      var bad = [];
      for (c in colMonth) {
        var val = row[c];
        if (val === null || val === undefined || val === '') { target[colMonth[c]] = 0; continue; }
        if (typeof val !== 'number' || !isFinite(val)) { bad.push(F.MONTHS[colMonth[c]]); continue; }
        target[colMonth[c]] = val;
      }
      if (bad.length) errs.push({ row: rn, what: (row[0] || 'Company') + ' \u00b7 ' + row[1],
        why: 'has non-numeric cells in ' + bad.join(', ') + '; those months import as zero' });
    }

    var missing = [];
    F.CHANNELS.forEach(function (ch) { F.CHANNEL_LINES.forEach(function (l) {
      if (!filled[ch.key + '/' + l.key]) missing.push(ch.label + ' \u00b7 ' + l.label); }); });
    F.COMPANY_LINES.forEach(function (l) { if (!filled['company/' + l.key]) missing.push('Company \u00b7 ' + l.label); });
    if (missing.length) errs.push({ row: '\u2014', what: missing.length + ' row' + (missing.length > 1 ? 's' : '') + ' absent',
      why: missing.slice(0, 6).join('; ') + (missing.length > 6 ? ' and ' + (missing.length - 6) + ' more' : '') + ' \u2014 imported as zero' });

    return { scenario: sc, opening: opening, errors: errs, rowsRead: Object.keys(filled).length };
  }

  function handleUpload(scenarioKey, file) {
    var fr = new FileReader();
    fr.onerror = function () {
      S.importErrors = { scenario: scenarioKey, name: file.name, errors: [{ row: '\u2014', what: 'File', why: 'could not be read' }] };
      render();
    };
    fr.onload = function (e) {
      var res = parseWorkbook(e.target.result);
      if (!res.scenario) { S.importErrors = { scenario: scenarioKey, name: file.name, errors: res.errors }; render(); return; }
      S.data.scenarios[scenarioKey] = res.scenario;
      var k; for (k in res.opening) S.data.opening[k] = res.opening[k];
      S.data.meta = S.data.meta || {};
      S.data.meta.source = 'upload';
      S.source = 'upload'; S.sourceNote = file.name;
      var bad = validate(S.data);
      if (bad) { res.errors.unshift({ row: '\u2014', what: 'Import rejected', why: bad }); S.importErrors = { scenario: scenarioKey, name: file.name, errors: res.errors }; render(); return; }
      S.importErrors = { scenario: scenarioKey, name: file.name, errors: res.errors, rowsRead: res.rowsRead, ok: true };
      recompute(); save(); render();
    };
    fr.readAsArrayBuffer(file);
  }

  /* ------------------------- shareable copy ------------------------------ */
  // The markers are assembled at runtime so that this source file never
  // contains them literally — otherwise the writer would match its own code.
  var M_OPEN = '<!' + '--DATA-->', M_CLOSE = '<!' + '--/DATA-->';
  function shareableCopy() {
    var tag = '<scr' + 'ipt id="embedded-data" type="application/json">' +
      JSON.stringify(S.data).replace(/<\//g, '<\\/') + '<\/scr' + 'ipt>';
    var esc1 = function (x) { return x.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'); };
    var re = new RegExp(esc1(M_OPEN) + '[\\s\\S]*?' + esc1(M_CLOSE));
    var body = M_OPEN + '\n' + tag + '\n' + M_CLOSE;
    var out = re.test(PRISTINE) ? PRISTINE.replace(re, function () { return body; })
                                : PRISTINE.replace('</head>', function () { return body + '\n</head>'; });
    var blob = new Blob([out], { type: 'text/html' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'fpa-dashboard-copy.html'; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 4000);
  }

  /* ------------------------------ Inputs tab ----------------------------- */
  function sourceLabel() {
    return { sample: 'Generated sample', upload: 'Uploaded workbook', stored: 'Saved in this browser',
             remote: 'data.json', embedded: 'Compiled into this file' }[S.source] || S.source;
  }

  function inputsTab() {
    var h = '', i, j;
    h += '<div class="banner ' + (S.source === 'sample' ? '' : 'ok') + '">Showing <strong>' + esc(sourceLabel()) +
      '</strong>' + (S.sourceNote ? ' \u2014 ' + esc(S.sourceNote) : '') + '. ' +
      (S.storage ? 'Changes are saved in this browser, so a refresh keeps them.'
                 : 'Local storage is ' + esc(S.storageNote || 'unavailable') + ', so changes will not survive a refresh. Save a shareable copy to keep them.') + '</div>';

    if (S.importErrors) {
      var ie = S.importErrors;
      h += '<div class="banner ' + (ie.ok ? (ie.errors.length ? '' : 'ok') : 'bad') + '">' +
        (ie.ok ? 'Imported ' + esc(ie.name) + ' into <strong>' + esc(ie.scenario) + '</strong> \u2014 ' + ie.rowsRead + ' rows read'
               : 'Could not import ' + esc(ie.name) + ' into <strong>' + esc(ie.scenario) + '</strong>') +
        (ie.errors.length ? ', ' + ie.errors.length + ' problem' + (ie.errors.length > 1 ? 's' : '') + ' below.' : '.') + '</div>';
      if (ie.errors.length) h += TABHELP.panel('Import report', esc(ie.name),
        '<div class="scroll"><table class="errtbl"><thead><tr><th>Row</th><th>What</th><th>Problem</th></tr></thead><tbody>' +
        ie.errors.map(function (e) { return '<tr><td class="n">' + esc(e.row) + '</td><td>' + esc(e.what) + '</td><td>' + esc(e.why) + '</td></tr>'; }).join('') +
        '</tbody></table></div><div class="note">Bad rows are reported and left at zero rather than being quietly absorbed, so an import problem shows up here instead of as a wrong number on another tab.</div><div style="height:12px"></div>');
    }

    h += TABHELP.panel('Excel round trip', 'one sheet \u00b7 column A channel, column B line item, columns C\u2013N Jan\u2013Dec',
      '<div class="body"><div class="io"><button class="btn" data-act="template">Download template</button>' +
      '<select id="tplScenario">' + F.SCENARIOS.map(function (s) {
        return '<option value="' + s.key + '"' + (s.key === S.scenario ? ' selected' : '') + '>' + s.label + ' figures</option>'; }).join('') +
      '</select><span class="muted">The template downloads populated, so it doubles as an export.</span></div>' +
      '<h3 class="sec">Upload against the same template</h3>' +
      F.SCENARIOS.map(function (s) {
        return '<div class="filerow"><strong>' + s.label + '</strong>' +
          '<input type="file" accept=".xlsx,.xlsm,.xls" data-upload="' + s.key + '"></div>';
      }).join('') +
      '<div class="note" style="padding-left:0">Dates in the header row are written as real Excel dates and read back as serial numbers converted arithmetically in UTC, so the month a figure lands in does not depend on the reader\u2019s time zone.</div>' +
      '</div>');

    h += TABHELP.panel('Keep and share', '',
      '<div class="body"><div class="io">' +
      '<button class="btn" data-act="share">Save a shareable copy</button>' +
      '<button class="btn ghost" data-act="reset">Reset to sample data</button>' +
      (S.storage ? '<button class="btn ghost" data-act="clear">Clear saved data</button>' : '') +
      '</div><div class="note" style="padding-left:0">A shareable copy is a new HTML file with the current figures compiled into it. It opens correctly for anyone, including in a private window, with no upload and no server.' +
      (/^https?:$/.test(location.protocol) ? ' This page also looks for a <code>data.json</code> beside it once per load.' : '') +
      '</div></div>');

    // editable primitives
    var ent = S.inputEntity || 'shopify';
    var lines = ent === 'company' ? F.COMPANY_LINES : F.CHANNEL_LINES;
    var vals = ent === 'company' ? S.data.scenarios[S.scenario].company : S.data.scenarios[S.scenario].channel[ent];
    var grid = '<div class="body"><div class="io"><label class="muted">Entity</label><select id="entSel">' +
      F.CHANNELS.map(function (c) { return '<option value="' + c.key + '"' + (ent === c.key ? ' selected' : '') + '>' + c.label + '</option>'; }).join('') +
      '<option value="company"' + (ent === 'company' ? ' selected' : '') + '>Company</option></select>' +
      '<span class="muted">Editing <strong>' + esc(F.SCENARIOS.filter(function (s) { return s.key === S.scenario; })[0].label) +
      '</strong>. Every other figure in the dashboard is derived from these.</span></div></div>';
    grid += '<div class="scroll"><table><thead><tr><th>Line item</th>' +
      F.MONTHS.map(function (m) { return '<th class="n">' + m + '</th>'; }).join('') + '</tr></thead><tbody>' +
      lines.map(function (l) {
        return '<tr><td class="name">' + esc(l.label) + '</td>' + F.MONTHS.map(function (mn, m) {
          return '<td class="n"><input class="cell" type="number" step="any" data-ent="' + ent + '" data-line="' +
            l.key + '" data-m="' + m + '" value="' + (vals[l.key][m]) + '"></td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    grid += '<div class="body"><h3 class="sec">Opening balances, 1 January</h3><div class="io">' +
      F.OPENING_LINES.map(function (l) {
        return '<label class="muted" style="display:flex;gap:6px;align-items:center">' + esc(l.label.replace('Opening ', '')) +
          '<input class="cell" style="border-color:var(--rule)" type="number" step="any" data-open="' + l.key +
          '" value="' + S.data.opening[l.key] + '"></label>';
      }).join('') + '</div>' +
      '<div class="note" style="padding-left:0">These five, plus the grid above, are the whole stored model. Inventory and cash balances for February onward are never stored \u2014 they roll forward, which is why the identities at the foot of the screen cannot drift out.</div></div>';
    h += TABHELP.panel('Stored primitives', 'the only figures entered anywhere', grid);
    return h;
  }

  /* ---------------------------- identity strip --------------------------- */
  function stripHTML() {
    var ids = F.identities(A.D(), S.m0, S.m1), ok = true;
    var cells = ids.map(function (id) {
      var good = Math.abs(id.delta) < 0.005; if (!good) ok = false;
      var eq = id.terms.map(function (t, i) {
        return (i ? ' ' + t.op + ' ' : '') + t.label + ' ' + A.money(t.value, 2);
      }).join('') + ' = ' + id.expectLabel + ' ' + A.money(id.expect, 2);
      return '<div class="srow"><span class="' + (good ? 'tick' : 'cross') + '">' + (good ? '\u2713' : '\u2715') +
        '</span><span class="lbl">' + esc(id.label) + '</span><span class="eq">' + esc(eq) +
        '</span><span class="d">\u0394 ' + id.delta.toFixed(2) + '</span></div>';
    }).join('');
    return '<div class="strip-head"><b>Identity check</b> \u00b7 recomputed live on ' + esc(A.rangeLabel()) +
      ' \u00b7 ' + esc(F.SCENARIOS.filter(function (s) { return s.key === S.scenario; })[0].label) +
      ' \u00b7 <span class="' + (ok ? 'tick' : 'cross') + '">' + (ok ? 'all three read zero' : 'a check has failed') +
      '</span><button data-act="strip">' + (document.body.classList.contains('strip-collapsed') ? 'show' : 'hide') +
      '</button></div><div class="strip-rows">' + cells + '</div>';
  }

  /* -------------------------------- render ------------------------------- */
  function controlsHTML() {
    var quick = [['YTD', 0, 11], ['H1', 0, 5], ['H2', 6, 11], ['Q4', 9, 11]];
    return '<div class="ctl"><label for="scn">Scenario</label><select id="scn">' +
      F.SCENARIOS.map(function (s) { return '<option value="' + s.key + '"' + (s.key === S.scenario ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="ctl"><label for="m0">Months</label><select id="m0">' +
      F.MONTHS.map(function (m, i) { return '<option value="' + i + '"' + (i === S.m0 ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
      '</select><span class="muted">to</span><select id="m1">' +
      F.MONTHS.map(function (m, i) { return '<option value="' + i + '"' + (i === S.m1 ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="chips">' + quick.map(function (q) {
        return '<button data-q="' + q[1] + ',' + q[2] + '" aria-pressed="' + (S.m0 === q[1] && S.m1 === q[2]) + '">' + q[0] + '</button>'; }).join('') + '</div>' +
      (S.tab === 'variance' ? '<div class="ctl"><label for="cmp">Against</label><select id="cmp">' +
        '<option value="plan"' + (S.compare === 'plan' ? ' selected' : '') + '>Plan</option>' +
        '<option value="forecast"' + (S.compare === 'forecast' ? ' selected' : '') + '>Forecast</option></select></div>' : '') +
      '<button class="toggle" data-act="formulas" aria-pressed="' + S.formulas + '">Show formulas</button>';
  }

  function render() {
    S.narrow = window.innerWidth < 760;
    document.body.classList.toggle('formulas', S.formulas);
    document.getElementById('controls').innerHTML = controlsHTML();
    document.getElementById('src').textContent = sourceLabel();
    var nav = document.getElementById('tabs');
    nav.innerHTML = TABLIST.map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>';
    }).join('');
    document.getElementById('view').innerHTML = S.tab === 'inputs' ? inputsTab() : window.TABS[S.tab]();
    document.getElementById('strip').innerHTML = stripHTML();
  }
  function refreshStrip() { document.getElementById('strip').innerHTML = stripHTML(); }

  /* -------------------------------- events ------------------------------- */
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'scn') { S.scenario = el.value; render(); }
    else if (el.id === 'm0') { S.m0 = +el.value; if (S.m1 < S.m0) S.m1 = S.m0; render(); }
    else if (el.id === 'm1') { S.m1 = +el.value; if (S.m0 > S.m1) S.m0 = S.m1; render(); }
    else if (el.id === 'cmp') { S.compare = el.value; render(); }
    else if (el.id === 'entSel') { S.inputEntity = el.value; render(); }
    else if (el.hasAttribute && el.hasAttribute('data-upload')) {
      if (el.files && el.files[0]) handleUpload(el.getAttribute('data-upload'), el.files[0]);
    } else if (el.classList && el.classList.contains('cell')) {
      var v = parseFloat(el.value); if (!isFinite(v)) v = 0;
      if (el.hasAttribute('data-open')) S.data.opening[el.getAttribute('data-open')] = v;
      else {
        var ent = el.getAttribute('data-ent'), ln = el.getAttribute('data-line'), m = +el.getAttribute('data-m');
        if (ent === 'company') S.data.scenarios[S.scenario].company[ln][m] = v;
        else S.data.scenarios[S.scenario].channel[ent][ln][m] = v;
      }
      recompute(); save(); refreshStrip();
    }
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.hasAttribute('data-tab')) { S.tab = b.getAttribute('data-tab'); render(); window.scrollTo(0, 0); }
    else if (b.hasAttribute('data-q')) { var q = b.getAttribute('data-q').split(','); S.m0 = +q[0]; S.m1 = +q[1]; render(); }
    else if (b.getAttribute('data-act') === 'formulas') { S.formulas = !S.formulas; render(); }
    else if (b.getAttribute('data-act') === 'strip') { document.body.classList.toggle('strip-collapsed'); refreshStrip(); }
    else if (b.getAttribute('data-act') === 'template') { downloadTemplate(document.getElementById('tplScenario').value); }
    else if (b.getAttribute('data-act') === 'share') { shareableCopy(); }
    else if (b.getAttribute('data-act') === 'reset') {
      S.data = F.generateSample(); S.source = 'sample'; S.sourceNote = ''; S.importErrors = null;
      recompute(); save(); render();
    } else if (b.getAttribute('data-act') === 'clear') {
      try { localStorage.removeItem(KEY); } catch (err) {}
      S.data = F.generateSample(); S.source = 'sample'; S.sourceNote = ''; S.importErrors = null;
      recompute(); render();
    }
  });

  var rt; window.addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(function () {
      var n = window.innerWidth < 760; if (n !== S.narrow) render();
    }, 180);
  });

  /* --------------------------------- boot -------------------------------- */
  function boot() {
    S.storage = storageOK();
    var loaded = null;
    var tag = document.getElementById('embedded-data');
    if (tag && tag.textContent.trim().length > 20) {
      try { var d = JSON.parse(tag.textContent); if (!validate(d)) { loaded = d; S.source = 'embedded'; } } catch (e) {}
    }
    if (!loaded && S.storage) {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) { var d2 = JSON.parse(raw); if (!validate(d2)) { loaded = d2; S.source = 'stored'; } }
      } catch (e) {}
    }
    S.data = loaded || F.generateSample();
    if (!loaded) S.source = 'sample';
    recompute(); render();

    // exactly one data.json fetch per load, only when hosted
    if (!loaded && /^https?:$/.test(location.protocol) && typeof fetch === 'function') {
      fetch('data.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) return;
          var bad = validate(d);
          if (bad) { S.sourceNote = 'data.json ignored \u2014 ' + bad; render(); return; }
          S.data = d; S.source = 'remote'; S.sourceNote = ''; recompute(); render();
        }).catch(function () {});
    }
  }
  boot();
}());

</script>
</body>
</html>
